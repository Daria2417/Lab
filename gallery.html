<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея </title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ваши стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт галереи -->
    <script src="gallery.js" defer></script>
</head>
<header class="bg-custom-green text-while py-3">

        <div class = "cotainer d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
                <span class = "fs-4 fw-bold text-light"> Название сайта</span>
    </header>
<body class="bg-site">

    <div class="container mt-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Вернуться на главную</a>
    </div>

    <main class="container mt-5">
        <h2 class="text-center mb-4">Галерея изображений</h2>
        
        <div class="gallery-wrapper">
            <!-- Кнопка "Влево" -->
            <button class="gallery-btn" id="btn-prev">←</button>

            <!-- Окно просмотра -->
            <div class="gallery-viewport">
                <!-- Лента с картинками (сюда JS будет применять сдвиг) -->
                <div class="gallery-track" id="gallery-track">
                    <!-- 8 картинок (используем заглушки picsum) -->
                    <div class="gallery-item"><img src="image2.jpg" alt="Фото 1"></div>
                    <div class="gallery-item"><img src="image3.jpg" alt="Фото 2"></div>
                    <div class="gallery-item"><img src="image4.jpg" alt="Фото 3"></div>
                    <div class="gallery-item"><img src="image5.jpg" alt="Фото 4"></div>
                    <div class="gallery-item"><img src="image6.jpg" alt="Фото 5"></div>
                    <div class="gallery-item"><img src="image7.jpg" alt="Фото 6"></div>
                    <div class="gallery-item"><img src="image8.jpg" alt="Фото 7"></div>
                    <div class="gallery-item"><img src="image9.jpg" alt="Фото 8"></div>
                </div>
            </div>

            <!-- Кнопка "Вправо" -->
            <button class="gallery-btn" id="btn-next">→</button>
        </div>

        <!-- Пейджер (точки) -->
        <div class="gallery-pager mt-4" id="gallery-pager">
            <!-- Точки будут генерироваться через JS -->
        </div>
    </main>
   
</body>
</html>
