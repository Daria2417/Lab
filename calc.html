<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг (Задание 6)</title>
    
    <!-- Подключение Bootstrap (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Подключение ваших стилей -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Подключение вашего скрипта (defer обязателен) -->
    <script src="calc-script.js" defer></script>
</head>

<header class="bg-custom-green text-while py-3">

        <div class = "cotainer d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
                <span class = "fs-4 fw-bold text-light"> Название сайта</span>
    </header>
<body class="bg-site">

    <!-- Кнопка возврата на главную (опционально) -->
    <div class="container mt-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Вернуться на главную</a>
    </div>

    <main class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Калькулятор стоимости услуги</h2>
                        
                        <!-- 1. Выбор типа услуги -->
                        <div class="mb-3">
                            <p class="fw-bold mb-2">Выберите тип услуги:</p>
                            
                            <div class="form-check">
                                <input class="form-check-input service-type" type="radio" name="serviceType" id="type1" value="1" checked>
                                <label class="form-check-label" for="type1">Услуга 1 </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input service-type" type="radio" name="serviceType" id="type2" value="2">
                                <label class="form-check-label" for="type2">Услуга 2 </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input service-type" type="radio" name="serviceType" id="type3" value="3">
                                <label class="form-check-label" for="type3">Услуга 3 </label>
                            </div>
                        </div>

                        <hr>

                        <!-- 2. Выбор опции (Список). Изначально скрыт (d-none) -->
                        <div class="mb-3 d-none" id="options-wrapper">
                            <label for="productOption" class="form-label fw-bold">Выберите опцию:</label>
                            <select class="form-select" id="productOption">
                                <option value="0">Без опции (0 руб.)</option>
                                <option value="50">Опция А (+50 руб.)</option>
                                <option value="100">Опция Б (+100 руб.)</option>
                            </select>
                        </div>

                        <!-- 3. Выбор свойства (Чекбокс). Изначально скрыт (d-none) -->
                        <div class="mb-3 d-none" id="checkbox-wrapper">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="productProperty" value="150">
                                <label class="form-check-label fw-bold" for="productProperty">
                                    Дополнительное свойство (+150 руб.)
                                </label>
                            </div>
                        </div>

                        <!-- 4. Поле для ввода количества -->
                        <div class="mb-4">
                            <label for="quantityInput" class="form-label fw-bold">Количество:</label>
                            <input type="number" class="form-control" id="quantityInput" value="1" min="1">


</div>

                        <!-- 5. Итоговая цена -->
                        <div class="alert alert-custom text-while text-center fs-5 m-0" role="alert">
                            Итого: <span id="totalPrice" class="fw-bold">100</span> руб.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
